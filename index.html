<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-text="pageTitle">Vijo's Buzzer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link rel="icon" href="favicon.png">
</head>
<body>
    <div id="setup-screen" class="panel">
        <h1 data-text="title">BUZZER</h1>
        <div class="input-group">
            <label data-text="joinCode">JOIN CODE</label>
            <input type="text" id="join-code" placeholder="e.g. WAR-7K2P" autocomplete="off">
        </div>
        <div class="input-group">
            <label data-text="name">CALLSIGN</label>
            <input type="text" id="player-name" placeholder="YOUR NAME" data-placeholder="namePlaceholder" autocomplete="off">
        </div>
        <button id="connect-btn" data-text="connect">INITIALIZE CONNECTION</button>
        <p id="status-msg" data-text="standby">STANDBY...</p>
    </div>

    <div id="buzzer-screen" class="panel hidden">
        <div id="remote-header">
            <span id="display-name">COMMANDER</span>
            <span id="conn-status" class="online" data-text="online">ONLINE</span>
        </div>
        <button id="buzzer-btn">
            <div class="btn-inner" data-text="buzz">BUZZ</div>
        </button>
        <p id="feedback-msg" data-text="ready">READY FOR ENGAGEMENT</p>
        <p id="late-msg" class="hidden"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
